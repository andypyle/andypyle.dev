<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 276" role="img" font-family="'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>AI-assisted component scaffolding with governance</title>
  <desc>A Figma file is read by the Figma MCP server and passed to Claude Code. A CLAUDE.md rules file requires Claude Code to use the Plop scaffolder, which creates every new component the same way before it lands in Chroma.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g fill="none" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="200" y1="68" x2="256" y2="68"/>
    <line x1="420" y1="68" x2="476" y2="68"/>
    <path d="M510 96 L510 138 L340 138 L340 176"/>
    <line x1="600" y1="180" x2="600" y2="100"/>
    <line x1="260" y1="208" x2="204" y2="208"/>
  </g>

  <g text-anchor="middle" dominant-baseline="central">
    <rect x="40" y="40" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="120" y="58" font-size="14" font-weight="500" fill="#444441">Figma file</text>
    <text x="120" y="78" font-size="12" fill="#5F5E5A">Design source</text>

    <rect x="260" y="40" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="340" y="58" font-size="14" font-weight="500" fill="#3C3489">Figma MCP</text>
    <text x="340" y="78" font-size="12" fill="#534AB7">Reads design data</text>

    <rect x="480" y="40" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="560" y="58" font-size="14" font-weight="500" fill="#3C3489">Claude Code</text>
    <text x="560" y="78" font-size="12" fill="#534AB7">Builds the component</text>

    <rect x="40" y="180" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="120" y="198" font-size="14" font-weight="500" fill="#085041">Chroma</text>
    <text x="120" y="218" font-size="12" fill="#0F6E56">In its atomic tier</text>

    <rect x="260" y="180" width="160" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
    <text x="340" y="198" font-size="14" font-weight="500" fill="#712B13">Plop scaffolder</text>
    <text x="340" y="218" font-size="12" fill="#993C1D">Same scaffold for all</text>

    <rect x="480" y="180" width="160" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
    <text x="560" y="198" font-size="14" font-weight="500" fill="#712B13">CLAUDE.md</text>
    <text x="560" y="218" font-size="12" fill="#993C1D">Requires the scaffolder</text>
  </g>
</svg>