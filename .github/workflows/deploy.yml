# Checks accessibility on every push and pull request; deploys to Cloudflare only when a push to main passes.
name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One deploy at a time, so an older run can't finish after a newer one and overwrite it
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # pnpm version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # Builds dist/ and runs axe on every page; a violation fails the run and skips the deploy
      - run: pnpm a11y

      - name: Deploy to Cloudflare
        if: github.event_name == 'push'
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
